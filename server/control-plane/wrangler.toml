name = "moontail"
main = "worker.ts"
compatibility_date = "2025-03-01"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Registry"]

[vars]
ACCESS_TOKEN_TTL_SEC = "3600"
SESSION_TTL_SEC = "3600"
PEER_STALE_SEC = "120"
MIN_VOLUNTEERS = "3"
MAX_CONCURRENT_PROMPTS = "3"
QUEUE_JOB_TTL_HOURS = "24"
FEATURE_CREDITS = "0"
CREDITS_PER_SEC = "1"
# Production: set CF_ACCESS_CLIENT_ID + CF_ACCESS_CLIENT_SECRET as Worker secrets (sessions fail closed without them)
